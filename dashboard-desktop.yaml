title: Brewaucracy
views:
  - title: Brewaucracy
    path: brewaucracy
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Presently Sanctioned Potable Intoxicants
            grid_options:
              rows: 1
          - type: custom:mushroom-template-card
            entity: sensor.brewaucracy_tap_00
            picture: '{{ state_attr(entity, ''entity_picture'') }}'
            badge_text: '{{ state_attr(entity, ''tap'') }}'
            primary: >-
              {%- set b = state_attr(entity, 'brewery') or '' -%} {%- set s =
              states(entity) -%} {{ s[(b ~ ' - ') | length:] if b and
              s.startswith(b ~ ' - ') else s }}
            secondary: >-
              {%- set pref = states('select.brewaucracy_preferred_vessel_size') |
              int(0) -%} {%- set p = state_attr(entity, 'prices') or [] | list
              -%} {%- set by_vol = p | sort(attribute='volume_ml') | list -%}
              {%- set fit = by_vol | selectattr('volume_ml', 'le', pref) | list
              -%} {%- if not by_vol -%}{%- set pick = none -%} {%- elif pref <=
              0 -%}{%- set pick = by_vol | last -%} {%- elif fit -%}{%- set pick
              = fit | last -%} {%- else -%}{%- set pick = by_vol | first -%} {%-
              endif -%} {%- set abv = state_attr(entity, 'abv') -%} {{
              ([state_attr(entity, 'brewery'), state_attr(entity, 'style'),
              ('%.1f%%' | format(abv)) if abv else ''] | select | join(' · '))
                 ~ ('\n$' ~ ('%.2f' | format(pick.amount)) ~ ' / ' ~ pick.volume_ml ~ 'ml' if pick else '') }}
            multiline_secondary: true
            tap_action:
              action: more-info
            grid_options:
              columns: full
            visibility:
              - condition: state
                entity: sensor.brewaucracy_tap_00
                state_not: Not in Service
