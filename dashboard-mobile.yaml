      - type: grid
        cards:
          - type: heading
            heading: Approved Catering Permits
          - type: custom:mushroom-template-card
            icon: mdi:calendar-week
            secondary: >-
              {%- set ns = namespace(lines=[]) -%} {%- set today = now().date()
              | string -%} {%- for day, e in [['Thu',
              'sensor.brewaucracy_food_truck_4_thursday'],
                                  ['Fri', 'sensor.brewaucracy_food_truck_5_friday'],
                                  ['Sat', 'sensor.brewaucracy_food_truck_6_saturday'],
                                  ['Sun', 'sensor.brewaucracy_food_truck_7_sunday']] -%}
                {%- set d = state_attr(e, 'date') -%}
                {%- if not d or (d | string) > today -%}
                  {%- set s = states(e) -%}
                  {%- set t = state_attr(e, 'from_time') -%}
                  {%- set ns.lines = ns.lines + [day ~ ': ' ~ ('Not yet announced' if s in ['unknown', 'unavailable'] else s) ~ (' from ' ~ t if t else '')] -%}
                {%- endif -%}
              {%- endfor -%} {{ ns.lines | join('\n') if ns.lines else 'Nothing
              further this week' }}
            multiline_secondary: true
            grid_options:
              columns: full
